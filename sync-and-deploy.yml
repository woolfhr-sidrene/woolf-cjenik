name: Sinkroniziraj i objavi cjenik

on:
  workflow_dispatch:
  schedule:
    # 07:40 po ljetnom / 06:40 po zimskom vremenu: nakon osvježavanja feedova u 06:30.
    - cron: "40 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: woolf-cjenik-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Izradi cjenik iz Woolf feeda
        env:
          WOOLF_FEED_URL: ${{ secrets.WOOLF_FEED_URL }}
        run: node scripts/sync.mjs

      - name: Provjeri rezultate
        run: node scripts/check.mjs

      - name: Spremi dnevnu arhivu cjenika
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Automatski cjenik $(date -u +'%Y-%m-%d')"
          git push

      - name: Pripremi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Zapakiraj stranicu
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Objavi stranicu
        id: deployment
        uses: actions/deploy-pages@v4
