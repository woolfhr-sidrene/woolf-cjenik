<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arhiva cjenika | Woolf</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,sans-serif}
    main{width:min(900px,calc(100% - 30px));margin:36px auto;padding:30px;background:#fff;border:1px solid #e4e4e4;border-radius:10px}
    h1{margin:0 0 8px;font-size:30px}
    .intro{margin:0 0 28px;color:#666;line-height:1.5}
    .status{padding:18px;background:#f7f7f7;border-radius:7px;color:#555}
    .list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
    .item{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border:1px solid #e5e5e5;border-radius:7px}
    .date{font-size:17px;font-weight:700}
    .meta{display:block;margin-top:5px;color:#777;font-size:13px}
    .actions{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
    .button{display:inline-block;white-space:nowrap;padding:11px 18px;border-radius:5px;background:#d8442f;color:#fff;text-decoration:none;font-weight:700}
    .button:hover{background:#bd3827}
    .button.xml{background:#333}
    .button.xml:hover{background:#111}
    .group{display:flex;align-items:center;gap:10px;justify-content:flex-end}
    .group+.group{margin-top:8px}
    .label{min-width:62px;color:#555;font-size:13px;font-weight:700;text-align:right}
    @media(max-width:600px){main{margin:15px auto;padding:20px}h1{font-size:24px}.item{align-items:stretch;flex-direction:column}.actions{align-items:stretch}.group{justify-content:stretch;flex-wrap:wrap}.label{min-width:0;text-align:left;flex-basis:100%}.button{flex:1;text-align:center}}
  </style>
</head>
<body>
  <main>
    <h1>Arhiva cjenika</h1>
    <p class="intro">Važeći cjenik robe i cjenik usluga (dostava, doplate za način plaćanja) objavljuju se svakoga dana do 11:00, a pri promjeni cijene usluge odmah. Prijašnji cjenici dostupni su najmanje 15 dana od zamjene.</p>
    <div id="content" class="status">Učitavanje arhive…</div>
  </main>

  <script>
    const content = document.getElementById("content");
    // Prikazuju se cjenici iz zadnjih 16 dana (Pravilnik o načinu objave cjenika, čl. 3. st. 6.:
    // arhivski cjenik dostupan 15 dana od zamjene + 1 dan rezerve). Datoteke se u arhivi čuvaju
    // 30 dana jer iz njih dorade na woolf.hr računaju najnižu cijenu u zadnjih 30 dana.
    const SHOW_DAYS = 16;
    const todayZagreb = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Zagreb", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    const cutoff = new Date(`${todayZagreb}T12:00:00Z`);
    cutoff.setUTCDate(cutoff.getUTCDate() - SHOW_DAYS);
    const cutoffDate = cutoff.toISOString().slice(0, 10);
    const formatTime = (value) => value ? new Intl.DateTimeFormat("hr-HR", { timeZone: "Europe/Zagreb", hour: "2-digit", minute: "2-digit" }).format(new Date(value)) : "";
    const formatDate = (value) => new Intl.DateTimeFormat("hr-HR", {
      day: "2-digit", month: "2-digit", year: "numeric"
    }).format(new Date(`${value}T12:00:00`));

    fetch(`data/archive/index.json?v=${Date.now()}`, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("Arhiva još nije dostupna.");
        return response.json();
      })
      .then((archive) => {
        const entries = (archive.entries || []).filter((entry) => entry.date >= cutoffDate);
        if (!entries.length) throw new Error("Arhiva još nema spremljenih cjenika.");
        content.className = "";
        content.innerHTML = `<ul class="list">${entries.map((entry, index) => `
          <li class="item">
            <div>
              <span class="date">Cjenik – ${formatDate(entry.date)}${index === 0 ? " (važeći)" : ""}</span>
              <span class="meta">Objavljen u ${formatTime(entry.generatedAt)} · ${entry.products.toLocaleString("hr-HR")} proizvoda / ${entry.variants.toLocaleString("hr-HR")} varijanti${entry.usluge ? ` · ${entry.usluge} usluga` : ""}</span>
            </div>
            <div class="actions">
              <div class="group">
                ${entry.uslugeCsvFilename ? '<span class="label">Roba</span>' : ""}
                <a class="button" href="data/archive/${encodeURIComponent(entry.csvFilename || entry.filename)}" download>Preuzmi CSV</a>
                ${entry.xmlFilename ? `<a class="button xml" href="data/archive/${encodeURIComponent(entry.xmlFilename)}" download>Preuzmi XML</a>` : ""}
              </div>
              ${entry.uslugeCsvFilename ? `<div class="group">
                <span class="label">Usluge</span>
                <a class="button" href="data/archive/${encodeURIComponent(entry.uslugeCsvFilename)}" download>Preuzmi CSV</a>
                <a class="button xml" href="data/archive/${encodeURIComponent(entry.uslugeXmlFilename)}" download>Preuzmi XML</a>
              </div>` : ""}
            </div>
          </li>`).join("")}</ul>`;
      })
      .catch((error) => {
        content.textContent = error.message;
      });
  </script>
</body>
</html>
