<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arhiva cjenika | Woolf</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,sans-serif}
    main{width:min(900px,calc(100% - 30px));margin:36px auto;padding:30px;background:#fff;border:1px solid #e4e4e4;border-radius:10px}
    h1{margin:0 0 8px;font-size:30px}
    .intro{margin:0 0 28px;color:#666;line-height:1.5}
    .status{padding:18px;background:#f7f7f7;border-radius:7px;color:#555}
    .list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
    .item{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border:1px solid #e5e5e5;border-radius:7px}
    .date{font-size:17px;font-weight:700}
    .meta{display:block;margin-top:5px;color:#777;font-size:13px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .button{display:inline-block;white-space:nowrap;padding:11px 18px;border-radius:5px;background:#d8442f;color:#fff;text-decoration:none;font-weight:700}
    .button:hover{background:#bd3827}
    .button.xml{background:#333}
    .button.xml:hover{background:#111}
    @media(max-width:600px){main{margin:15px auto;padding:20px}h1{font-size:24px}.item{align-items:stretch;flex-direction:column}.actions{justify-content:stretch}.button{flex:1;text-align:center}}
  </style>
</head>
<body>
  <main>
    <h1>Arhiva cjenika</h1>
    <p class="intro">Novi cjenik automatski se izrađuje svakoga dana. Dostupni su cjenici za posljednjih 30 dana.</p>
    <div id="content" class="status">Učitavanje arhive…</div>
  </main>

  <script>
    const content = document.getElementById("content");
    const formatDate = (value) => new Intl.DateTimeFormat("hr-HR", {
      day: "2-digit", month: "2-digit", year: "numeric"
    }).format(new Date(`${value}T12:00:00`));

    fetch(`data/archive/index.json?v=${Date.now()}`, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("Arhiva još nije dostupna.");
        return response.json();
      })
      .then((archive) => {
        if (!archive.entries?.length) throw new Error("Arhiva još nema spremljenih cjenika.");
        content.className = "";
        content.innerHTML = `<ul class="list">${archive.entries.map((entry) => `
          <li class="item">
            <div>
              <span class="date">Cjenik – ${formatDate(entry.date)}</span>
              <span class="meta">${entry.products.toLocaleString("hr-HR")} proizvoda / ${entry.variants.toLocaleString("hr-HR")} varijanti</span>
            </div>
            <div class="actions">
              <a class="button" href="data/archive/${encodeURIComponent(entry.csvFilename || entry.filename)}" download>Preuzmi CSV</a>
              ${entry.xmlFilename ? `<a class="button xml" href="data/archive/${encodeURIComponent(entry.xmlFilename)}" download>Preuzmi XML</a>` : ""}
            </div>
          </li>`).join("")}</ul>`;
      })
      .catch((error) => {
        content.textContent = error.message;
      });
  </script>
</body>
</html>
